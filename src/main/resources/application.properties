spring.application.name=velocity-limiter
velocity.limits.daily-amount=5000.00
velocity.limits.weekly-amount=20000.00
velocity.limits.daily-count=3
# H2 syntax: max wait (ms) for another load of the same customer to release its lock
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 1000
spring.jackson.deserialization.fail-on-unknown-properties=true
# stop the batch once more lines than threshold are rejected
batch.max-rejected-lines=100
